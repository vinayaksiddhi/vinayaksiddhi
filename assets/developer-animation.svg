<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="dev-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="dev-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#bc8cff"/>
    </linearGradient>
  </defs>
  
  <!-- Terminal window -->
  <rect x="30" y="30" width="340" height="240" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  
  <!-- Title bar -->
  <rect x="30" y="30" width="340" height="30" rx="10" fill="#161b22"/>
  <rect x="30" y="50" width="340" height="10" fill="#161b22"/>
  
  <!-- Window buttons -->
  <circle cx="52" cy="45" r="5" fill="#f85149" opacity="0.8"/>
  <circle cx="70" cy="45" r="5" fill="#d29922" opacity="0.8"/>
  <circle cx="88" cy="45" r="5" fill="#3fb950" opacity="0.8"/>
  
  <!-- Terminal title -->
  <text x="200" y="49" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">vinayaksiddhi — zsh</text>
  
  <!-- Terminal content -->
  <g font-family="'Courier New', monospace" font-size="12">
    <text x="50" y="88" fill="#3fb950">❯</text>
    <text x="65" y="88" fill="#e6edf3">whoami</text>
    
    <text x="50" y="110" fill="#8b949e">Siddhi Vinayak</text>
    <text x="50" y="128" fill="#8b949e">EEE @ BMSIT&amp;M, Bengaluru</text>
    
    <text x="50" y="156" fill="#3fb950">❯</text>
    <text x="65" y="156" fill="#e6edf3">cat skills.json</text>
    
    <text x="50" y="178" fill="#58a6ff">{</text>
    <text x="62" y="196" fill="#bc8cff">"frontend"</text>
    <text x="148" y="196" fill="#8b949e">: </text>
    <text x="158" y="196" fill="#3fb950">"React, Next.js"</text>
    <text x="62" y="214" fill="#bc8cff">"backend"</text>
    <text x="140" y="214" fill="#8b949e">: </text>
    <text x="150" y="214" fill="#3fb950">"Node.js, Express"</text>
    <text x="62" y="232" fill="#bc8cff">"blockchain"</text>
    <text x="156" y="232" fill="#8b949e">: </text>
    <text x="166" y="232" fill="#3fb950">"Solidity, Hardhat"</text>
    <text x="50" y="250" fill="#58a6ff">}</text>
  </g>
  
  <!-- Blinking cursor -->
  <rect x="50" y="260" width="8" height="2" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
